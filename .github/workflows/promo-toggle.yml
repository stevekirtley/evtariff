name: Dated copy toggles

# Two date-driven rewrites, run together each morning:
#   1. the EDF referral promo copy (promo.config.json)
#   2. the VAT state — 5%, the 0% window from 1 Oct 2026 to 31 Mar 2027, then 5%
#      again (vat.config.json)
# Dates live in those config files; edit them rather than this workflow.

on:
  schedule:
    - cron: '20 5 * * *'   # 05:20 UTC daily (06:20 BST / 05:20 GMT)
  workflow_dispatch:
  push:
    paths:
      - 'promo.config.json'
      - 'vat.config.json'
      - 'scripts/apply-promo.py'
      - 'scripts/apply-vat.py'

permissions:
  contents: write

jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply the correct promo state
        run: python3 scripts/apply-promo.py

      - name: Apply the correct VAT state
        run: python3 scripts/apply-vat.py

      - name: Commit if the copy changed
        run: |
          if git diff --quiet; then
            echo "No change needed."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Auto-update dated copy (promo + VAT) for $(date -u +%Y-%m-%d)"
          git push
